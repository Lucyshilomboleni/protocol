<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EA-BLE Simulator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%230f766e%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
  <div class="bar">
    <span class="brand">EA-BLE Simulator</span>
    <!-- Tab buttons: each one shows its panel without reloading the page -->
    <nav class="tabs">
      <button class="tab active" data-tab="home">Home</button>
      <button class="tab" data-tab="objective1">Objective 1</button>
      <button class="tab" data-tab="objective2">Objective 2</button>
      <button class="tab" data-tab="objective3">Objective 3</button>
      <button class="tab" data-tab="objective4">Objective 4</button>
    </nav>
  </div>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer>EA-BLE = Energy-Aware Bluetooth Low Energy</footer>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
